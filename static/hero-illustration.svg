<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scholarship application approved illustration" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- soft background blob -->
  <circle cx="300" cy="250" r="220" fill="#ffffff" opacity="0.12"/>
  <circle cx="300" cy="250" r="165" fill="#ffffff" opacity="0.10"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="90" cy="120" r="5"/>
    <circle cx="520" cy="90" r="7"/>
    <circle cx="540" cy="300" r="4"/>
    <circle cx="60" cy="330" r="6"/>
    <path d="M500 190 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M110 220 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z"/>
  </g>

  <!-- application card shadow -->
  <rect x="178" y="130" width="260" height="310" rx="26" fill="#1e1b4b" opacity="0.22"/>
  <!-- application card -->
  <rect x="170" y="118" width="260" height="310" rx="26" fill="#ffffff"/>
  <!-- card header -->
  <rect x="170" y="118" width="260" height="62" rx="26" fill="#e8efff"/>
  <rect x="170" y="150" width="260" height="30" fill="#e8efff"/>
  <circle cx="205" cy="149" r="14" fill="#0250c5"/>
  <rect x="230" y="136" width="110" height="10" rx="5" fill="#0250c5"/>
  <rect x="230" y="154" width="70" height="8" rx="4" fill="#9db7ee"/>

  <!-- form lines -->
  <g fill="#e3e6ef">
    <rect x="200" y="208" width="200" height="12" rx="6"/>
    <rect x="200" y="236" width="160" height="12" rx="6"/>
    <rect x="200" y="264" width="180" height="12" rx="6"/>
  </g>

  <!-- approved badge -->
  <rect x="200" y="302" width="200" height="56" rx="16" fill="#e7f8ee"/>
  <circle cx="232" cy="330" r="17" fill="#22a45d"/>
  <path d="M223 330 l7 8 l13 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260" y="319" width="110" height="10" rx="5" fill="#22a45d"/>
  <rect x="260" y="336" width="75" height="8" rx="4" fill="#8fd4ae"/>

  <!-- progress bar -->
  <rect x="200" y="380" width="200" height="10" rx="5" fill="#e3e6ef"/>
  <rect x="200" y="380" width="150" height="10" rx="5" fill="#7651ad"/>

  <!-- graduation cap -->
  <g transform="translate(300 78)">
    <path d="M-62 14 v34 c0 14 28 26 62 26 s62 -12 62 -26 v-34 l-62 24 z" fill="#2a2670"/>
    <polygon points="0,-34 112,6 0,46 -112,6" fill="#1e1b4b"/>
    <polygon points="0,-34 112,6 0,10 -112,6" fill="#ffffff" opacity="0.10"/>
    <path d="M96 12 v50" stroke="#ffc83d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="96" cy="66" r="7" fill="#ffc83d"/>
    <circle cx="0" cy="6" r="5" fill="#ffc83d"/>
  </g>

  <!-- books stack (left) -->
  <g>
    <rect x="52" y="400" width="150" height="30" rx="6" fill="#ffc83d"/>
    <rect x="52" y="400" width="150" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="68" y="370" width="130" height="30" rx="6" fill="#ff7aa8"/>
    <rect x="68" y="370" width="130" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="58" y="340" width="138" height="30" rx="6" fill="#5ad1c4"/>
    <rect x="58" y="340" width="138" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- coins stack (right) -->
  <g>
    <ellipse cx="480" cy="424" rx="52" ry="14" fill="#e0a416"/>
    <rect x="428" y="406" width="104" height="18" fill="#f5b81c"/>
    <ellipse cx="480" cy="406" rx="52" ry="14" fill="#ffd54f"/>
    <ellipse cx="480" cy="388" rx="52" ry="14" fill="#e0a416"/>
    <rect x="428" y="370" width="104" height="18" fill="#f5b81c"/>
    <ellipse cx="480" cy="370" rx="52" ry="14" fill="#ffd54f"/>
    <ellipse cx="480" cy="352" rx="52" ry="14" fill="#e0a416"/>
    <rect x="428" y="334" width="104" height="18" fill="#f5b81c"/>
    <ellipse cx="480" cy="334" rx="52" ry="14" fill="#ffd54f"/>
    <text x="480" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b9810c">₹</text>
  </g>

  <!-- floating coin -->
  <circle cx="500" cy="250" r="22" fill="#ffd54f"/>
  <circle cx="500" cy="250" r="16" fill="none" stroke="#e0a416" stroke-width="3"/>
  <text x="500" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b9810c">₹</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
